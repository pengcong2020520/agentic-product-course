name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check privacy
        run: python scripts/privacy_check.py
      - name: Verify documentation
        run: python scripts/verify_docs.py
      - name: Run pipeline tests when present
        run: |
          if [ -d pipeline/tests ]; then
            python -m unittest discover -s pipeline/tests -t . -v
          else
            echo "Skipping pipeline tests: pipeline/tests/ does not exist."
          fi
