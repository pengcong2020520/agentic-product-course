<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="760" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">原始数据 — 公开评论收成数据集</text>

  <rect x="40" y="96" width="200" height="76" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="126" fill="#1e3a5f" font-size="14" font-weight="700" text-anchor="middle">1 应用清单</text>
  <text x="140" y="148" fill="#64748b" font-size="12" text-anchor="middle">11 个陪伴应用</text>

  <line x1="240" y1="134" x2="278" y2="134" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="96" width="200" height="76" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="126" fill="#1e3a5f" font-size="14" font-weight="700" text-anchor="middle">2 评论 RSS</text>
  <text x="380" y="148" fill="#64748b" font-size="12" text-anchor="middle">2 种排序 × 最多 10 页</text>

  <line x1="480" y1="134" x2="518" y2="134" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="520" y="96" width="200" height="76" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="620" y="126" fill="#92400e" font-size="14" font-weight="700" text-anchor="middle">3 空页即停</text>
  <text x="620" y="148" fill="#b45309" font-size="12" text-anchor="middle">间隔 1.5 秒</text>

  <path d="M 620 172 L 620 220 L 140 220 L 140 266" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="212" fill="#2563eb" font-size="11" text-anchor="middle">有评论就收进同一份</text>

  <rect x="40" y="268" width="200" height="76" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="140" y="298" fill="#92400e" font-size="14" font-weight="700" text-anchor="middle">4 按 id 合并</text>
  <text x="140" y="320" fill="#b45309" font-size="12" text-anchor="middle">同一条只留一份</text>

  <line x1="240" y1="306" x2="278" y2="306" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="268" width="200" height="76" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="380" y="298" fill="#92400e" font-size="14" font-weight="700" text-anchor="middle">5 哈希 id</text>
  <text x="380" y="320" fill="#b45309" font-size="12" text-anchor="middle">不留昵称</text>

  <line x1="480" y1="306" x2="518" y2="306" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="520" y="268" width="200" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="298" fill="#166534" font-size="14" font-weight="700" text-anchor="middle">6 写出文件</text>
  <text x="620" y="320" fill="#15803d" font-size="12" text-anchor="middle">jsonl + .meta.json</text>

  <rect x="40" y="364" width="680" height="48" rx="6" fill="#f1f5f9"/>
  <text x="380" y="384" fill="#334155" font-size="12" text-anchor="middle">一页最多 50 条。时间与条数写进 .meta.json。</text>
  <text x="380" y="402" fill="#64748b" font-size="11" text-anchor="middle">文件落在 data/raw/，不进公开仓库。</text>
</svg>
